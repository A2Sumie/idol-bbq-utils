bots:
  - name: 'example-bot'
    websites:                                 # (required) websites to forward tweets from
      - origin: 'https://x.com'               # (required) website origin, notice the slash at the end
        paths: ['user1', 'user2', 'user3']
        cookie_file: ./assets/tweet-forwarder/x.cookies
        config:
          cron: '*/2 * * * *'
      - origin: 'https://x.com'
        task_type: 'follows'
        task_title: '【Follows】'
        paths: ['user5', 'user6', 'user7']
        config:                               # (optional) task configurations
          cron: '5 23 * * *'                  # (optional) cron job default: '* * * * *'
          interval_time:                      # (optional) interval time default: {max: 0, min: 0}
            max: 0
            min: 0
          translator:                         # (optional) translator configurations
            type: 'none'                      # (required) translator type: 'none' | 'geminis' | 'deepseek-v3'
    forward_to:                               # (optional) forward to multiple platforms, you can add more than one
      - type: 'telegram'                      # (optional) forward type
        token: 'telegram bot token'           # (required) telegram bot token
        chat_id: 'telegram channel id'        # (required) telegram channel id
      - type: 'bilibili'                      # (optional) forward type
        token: 'SESSDATA in cookies'          # (required) bilibili SESSDATA
        bili_jct: 'blit_jct in cookies'       # (required) bilibili bili_jct
        video_upload:                         # (optional) direct biliup video upload
          enabled: true
          metadata_timezone: 'Asia/Tokyo'
          cookie_file: './assets/tweet-forwarder/bili.cookies.json' # (optional) preferred full biliup cookie JSON
          browser_cookie_sync:                # (optional) refresh cookie_file from project browser profile before upload
            enabled: true
            session_profile: 'bilibili-uploader'
            url: 'https://www.bilibili.com'
          metadata_templates:                 # (optional) placeholders: display_name user_id summary body_or_summary platform_type_label datetime url
            title: '【{{platform_type_label}}】{{display_name}} {{summary}}'
            description: |
              {{body_or_summary}}

              来源平台: {{platform_type_label}}
              来源账号: {{display_name}}
              账号标识: {{user_id}}
              发布时间: {{datetime}}
              原链接: {{url}}
      - type: 'qq'                            # (optional) forward type (onebot 11)
        token: 'onebot 11 token'              # (required) onebot 11 token
        group_id: 'qq group id'               # (required) qq group id
        url: 'onebot server url'              # (required) onebot server url
        # send_mode: 'merged_forward'          # (optional) use NapCat/go-cqhttp compatible group merged-forward
        # merged_forward:
        #   enabled: true
        #   node_name: 'idol-bbq'
        #   node_uin: '10000'
        # --- SnowLuma media delivery (see docs/snowluma.md; default 'file' = legacy file:// shared-fs) ---
        # media_delivery: 'auto'                # file | auto | inline | upload | url
        # media_url_base: 'http://127.0.0.1:8080/tweet-forwarder-media'   # url/auto: bridge-pullable base
        # media_inline_max_bytes: 2097152       # base64 inline cap (2 MiB)
        # media_upload_max_bytes: 536870912     # upload_file_stream cap (512 MiB)
        # media_upload_chunk_bytes: 1048576     # decoded chunk size
        # media_upload_timeout_ms: 60000        # per-chunk request timeout
        # media_upload_deadline_ms: 600000      # whole upload deadline
        # media_upload_retention_ms: 3600000    # bot-side file retention after upload
    config:                                   # (optional) forwarder configurations
      user_agent:  'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'                             # (optional) puppeteer supported user agent
      cron: "*/5 4-23 * * *"                  
      interval_time:
        max: 6000
        min: 2000
      media:                                  # (optional) media configurations, handle media files
        type: 'no-storage'                    # (optional) media type default 'no-storage', will delete media files after forwarding
        gallery_dl:                           # (optional) gallery_dl configurations
          path: '<path-to-gallery_dl-executable>'           # (required) path to gallery_dl executable
          cookie_file: './assets/tweet-forwarder/x.cookies'       # (required) path to cookies file
      translator:                             # (optional) translator configurations, if you want to translate the tweet
        type: 'gemini'                        # (required) translator type: 'geminis' | 'deepseek-v3'
        key: 'gemini-token'                   # (required) translator key
  - name: 'all-follows-bot'
    websites:
      - origin: 'https://x.com'
