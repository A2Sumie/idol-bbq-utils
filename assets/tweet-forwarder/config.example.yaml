  user_agent:  'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'                             # (not required) puppeteer supported user agent
  cron: "*/5 4-23 * * *"                      # (not required) cron job
  interval_time:
    max: 1000
    min: 10

